[package]
version = "0.1.0"
name = "block-processing-script"
edition = "2021"
default-run = "block_processing"

[[bin]]
name = "block_processing"
path = "src/bin/main.rs"

[[bin]]
name = "evm"
path = "src/bin/evm.rs"

[[bin]]
name = "vkey"
path = "src/bin/vkey.rs"

[dependencies]
sp1-sdk = "5.0.0"
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde = { version = "1.0.200", default-features = false, features = ["derive"] }
clap = { version = "4.0", features = ["derive", "env"] }
tracing = "0.1.40"
hex = "0.4.3"
# alloy-sol-types = { workspace = true }
dotenv = "0.15.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
state_processing_sp1 = { path = "../../state_processing_sp1" }
types = { path = "../../consensus/types", features = ["legacy-arith"], default-features = false }

[build-dependencies]
sp1-build = "5.0.0"
