[package]
name = "state_processing_sp1"
version = "0.2.0"
authors = ["Paul Hauner <paul@paulhauner.com>", "Michael Sproul <michael@sigmaprime.io>", "Manas Nagaraj <manas@sigmaprime.io>"]
edition = "2021"

[dependencies]
# Use exact same dependencies as original state_processing, just without rand/rayon/metrics
# arbitrary = { workspace = true } # Removed for SP1 compatibility
derivative = { workspace = true }
ethereum_hashing = { workspace = true }
ethereum_ssz = { workspace = true }
ethereum_ssz_derive = { workspace = true }
int_to_bytes = { workspace = true }
integer-sqrt = "0.1.5"
itertools = { workspace = true }
merkle_proof = { workspace = true }
safe_arith = { workspace = true }
smallvec = { workspace = true }
ssz_types = { workspace = true }
tree_hash = { workspace = true }
types = { workspace = true, features = ["legacy-arith"], default-features = false }

# SP1-compatible BLS with fake crypto
bls = { workspace = true }

[features]
default = []
fake_crypto = []
arbitrary-fuzz = []