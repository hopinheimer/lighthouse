[package]
name = "state_processing_sp1"
version = "0.2.0"
authors = ["Paul Hauner <paul@paulhauner.com>", "Michael Sproul <michael@sigmaprime.io>", "Manas Nagaraj <manas@sigmaprime.io>"]
edition = "2021"

[dependencies]
# Use exact same dependencies as original state_processing, just without rand/rayon/metrics
arbitrary = { workspace = true, default-features = false }
derivative = { workspace = true }
ethereum_hashing = { workspace = true }
ethereum_ssz = { workspace = true, default-features = false }
ethereum_ssz_derive = { workspace = true, default-features = false }
int_to_bytes = { workspace = true }
integer-sqrt = "0.1.5"
itertools = { workspace = true, default-features = false }
merkle_proof = { workspace = true }
safe_arith = { workspace = true }
smallvec = { workspace = true, default-features = false }
ssz_types = { workspace = true, default-features = false }
tree_hash = { workspace = true, default-features = false }
types = { workspace = true, default-features = false, features = ["legacy-arith"] }

# SP1-compatible BLS with fake crypto
bls = { workspace = true, default-features = false }

# [features]
# default = ["sp1"]
# sp1 = ["types/sp1"]