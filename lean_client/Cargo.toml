[package]
name = "lean_client"
version = "0.1.0"
edition.workspace = true

[dependencies]
clap = { workspace = true }
clap_utils = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
gossipsub = { workspace = true }
futures = { workspace = true }

[dependencies.libp2p]
version = "0.56"
default-features = false
features = [
    "identify",
    "yamux",
    "noise",
    "tcp",
    "tokio",
    "secp256k1",
    "macros",
    "ecdsa",
    "quic",
    "mdns"
]

[dependencies.lean-network]
path = "./network"
